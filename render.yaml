services:
  - type: web
    name: sprout-care
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: node --test test/*.test.mjs
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SPROUT_DEPLOYMENT
        value: cloud
      - key: SPROUT_PROVIDER
        value: gemini
      - key: SPROUT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: SPROUT_APP_TOKEN
        sync: false
      - key: SPROUT_DEVICE_ID
        sync: false
      - key: SPROUT_DEVICE_TOKEN
        sync: false
